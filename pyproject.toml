[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opengen"
version = "1.0.0"
description = "Modular, open-source, self-hostable AI generation framework for documents, presentations, images, and handwriting."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenGen Maintainers" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "docxtpl>=0.19.0",
    "litellm>=1.55.0",
    "mcp[cli]>=1.2.0",
    "huey>=2.5.0",
    "diskcache>=5.6.3",
    "typer>=0.12.5",
    "pillow>=10.4.0",
    "pymupdf>=1.24.0",
    "rapidocr>=3.1.0",
    "onnxruntime>=1.19.0",
    "defusedxml>=0.7.1",
    "structlog>=24.4.0",
    "json-repair>=0.30.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=62.0"]
docling = ["docling>=2.15.0"]
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
opengen = "opengen.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/opengen"]
