<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
      color: #ffffff;
      font-family: sans-serif;
      overflow: hidden;
    }
    .wrapper {
      width: 1080px;
      height: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .badge {
      padding: 14px 32px;
      background: rgba(99, 102, 241, 0.25);
      border: 2px solid #6366f1;
      border-radius: 9999px;
      font-size: 32px;
      font-weight: 700;
      color: #c7d2fe;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 40px;
    }
    .title {
      font-size: 96px;
      font-weight: 900;
      line-height: 1.1;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
    }
    .subtitle {
      font-size: 38px;
      color: #94a3b8;
      font-weight: 500;
      text-align: center;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div data-composition-id="reel_intro" data-duration="2" class="wrapper">
    <div class="badge">AI Motion Studio</div>
    <div class="title">REVOLUTIONIZE<br>VIDEO PRODUCTION</div>
    <div class="subtitle">1080 &times; 1920 &bull; 30 FPS &bull; Deterministic</div>
  </div>
  <script>
    const tl = gsap.timeline();
    tl.from(".badge", { opacity: 0, scale: 0.8, duration: 0.6, ease: "back.out(1.7)" })
      .from(".title", { opacity: 0, y: 50, duration: 0.8, ease: "power3.out" }, "-=0.3")
      .from(".subtitle", { opacity: 0, y: 30, duration: 0.6, ease: "power2.out" }, "-=0.4");
  </script>
</body>
</html>
